quarkus.application.name=odm-platform-adapter-devops-executor-starter

# CORS for HTTP resources the adopting service adds.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=*
quarkus.http.cors.methods=OPTIONS,HEAD,GET,PUT,POST,DELETE,PATCH
quarkus.http.cors.access-control-allow-credentials=false

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) correlation_id=%X{correlation_id} %s%e%n

# Fast-jar launcher stays quarkus-run.jar. Native runner uses the artifact id
# (Quarkus default output name): target/odm-platform-adapter-devops-executor-starter-<version>-runner
quarkus.package.output-name=odm-platform-adapter-devops-executor-starter

# This template ships no entity and no JDBC URL. Datasource and Hibernate ORM
# stay inactive so the build does not open a database. The adopting service
# adds entities, sets both flags to true, and configures
# quarkus.datasource.jdbc.url, quarkus.datasource.username, and
# quarkus.datasource.password. PageableSortValidator, HibernateListenerConfig,
# DefaultTransactionalOutboundPortImpl, and EntityInitAndDetachServiceImpl
# are registered only when quarkus.hibernate-orm.active is true.
quarkus.datasource.active=false
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.active=false

quarkus.http.port=9080
quarkus.log.category."org.executor".level=DEBUG

executor.simulation.run-duration=5s
executor.simulation.outcome=SUCCEEDED
